<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VastAI</title>
  <meta name="theme-color" content="#0f1115" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%2310b981'/><text x='50%25' y='56%25' font-size='34' font-family='Arial' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='middle'>V</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand"><div class="logo">V</div><span>VastAI</span></div>
        <button class="icon-btn only-mobile" id="closeSidebar" title="Close">✕</button>
      </div>
      <button class="new-chat" id="newChatBtn">＋ New chat</button>
      <input class="search" id="searchChats" placeholder="Search chats" />
      <nav class="chat-list" id="chatList"></nav>
      <div class="sidebar-bottom">
        <button class="side-link" id="openSettings">⚙ Settings</button>
        <button class="side-link" id="toggleTheme">◐ Theme</button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- Main chat -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebar" title="Menu">☰</button>
        <div class="model-picker" id="modelPicker">
          <button class="model-btn" id="modelBtn"><span id="modelLabel">Loading...</span><span class="chev">▾</span></button>
          <div class="model-menu" id="modelMenu"></div>
        </div>
        <div class="topbar-spacer"></div>
        <button class="icon-btn" id="topNewChat" title="New chat">✎</button>
      </header>

      <section class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="logo big">V</div>
          <h1>How can I help you today?</h1>
          <div class="suggestions">
            <button data-prompt="Build a modern landing page for a Lagos restaurant called Mama's Kitchen with a hero, menu section and contact form">Build a landing page</button>
            <button data-prompt="Write a Python script that renames all files in a folder by date">Write a Python script</button>
            <button data-prompt="Give me 5 business ideas I can start in Lagos with low capital">Business ideas in Lagos</button>
            <button data-prompt="Build a React todo app with add, complete and delete, styled nicely">Build a React app</button>
          </div>
        </div>
      </section>

      <footer class="composer-wrap">
        <div class="attachments" id="attachments"></div>
        <div class="composer">
          <div class="attach-wrap">
            <button class="icon-btn attach" id="attachBtn" title="Attach">＋</button>
            <div class="attach-menu" id="attachMenu">
              <button data-kind="image"><span class="ic">🖼</span><span><b>Image</b><small>PNG, JPG, WEBP</small></span></button>
              <button data-kind="pdf"><span class="ic">📕</span><span><b>PDF</b><small>Read and summarise PDFs</small></span></button>
              <button data-kind="doc"><span class="ic">📄</span><span><b>Document or code</b><small>TXT, MD, CSV, JSON, code files</small></span></button>
            </div>
          </div>
          <input type="file" id="fileImage" multiple hidden accept="image/png,image/jpeg,image/webp,image/gif" />
          <input type="file" id="filePdf" multiple hidden accept=".pdf,application/pdf" />
          <input type="file" id="fileDoc" multiple hidden accept=".txt,.md,.csv,.json,.js,.jsx,.ts,.tsx,.py,.html,.css,.dart,.sql,.xml,.yaml,.yml,.log,.php,.java,.kt,.swift,.go,.rs,.c,.cpp,.cs,.rb,.sh,.env.example" />
          <textarea id="input" rows="1" placeholder="Message VastAI"></textarea>
          <button class="send" id="sendBtn" title="Send">➤</button>
        </div>
        <p class="hint">VastAI can make mistakes. Check important info.</p>
      </footer>
    </main>

    <!-- Code / preview panel -->
    <aside class="panel" id="panel">
      <div class="panel-head">
        <div class="panel-title"><span id="panelLang" class="lang-pill">html</span><span id="panelName">index.html</span><span id="panelStatus" class="status"></span></div>
        <div class="tabs">
          <button class="tab active" data-tab="code">Code</button>
          <button class="tab" data-tab="preview" id="previewTab">Preview</button>
        </div>
        <div class="panel-actions">
          <button class="icon-btn sm" id="panelCopy" title="Copy">⧉</button>
          <button class="icon-btn sm" id="panelDownload" title="Download">⤓</button>
          <button class="icon-btn sm" id="panelOpen" title="Open in new tab">↗</button>
          <button class="icon-btn sm" id="panelClose" title="Close">✕</button>
        </div>
      </div>
      <div class="panel-body">
        <pre class="panel-code" id="panelCodeWrap"><code id="panelCode"></code></pre>
        <iframe id="panelFrame" class="panel-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups" title="Preview"></iframe>
      </div>
    </aside>
  </div>

  <!-- Settings modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Settings</h2>
        <button class="icon-btn" id="closeSettings">✕</button>
      </div>
      <label>Groq API key (main chat)
        <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off" />
      </label>
      <label>Gemini API key (images, optional)
        <input type="password" id="geminiKey" placeholder="AIza..." autocomplete="off" />
        <small>Keys are stored only in this browser and sent only to Groq or Google.</small>
      </label>
      <label>Custom instructions (system prompt)
        <textarea id="systemPrompt" rows="5"></textarea>
      </label>
      <label>Creativity (temperature): <span id="tempVal"></span>
        <input type="range" id="temperature" min="0" max="1.5" step="0.1" />
      </label>
      <div class="modal-actions">
        <button class="danger" id="clearAll">Delete all chats</button>
        <button class="primary" id="saveSettings">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="slides.js"></script>
  <script src="files.js"></script>
  <script src="app.js"></script>
</body>
</html>
